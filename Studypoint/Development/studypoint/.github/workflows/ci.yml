name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-checks:
    name: Repo audit, JS tests, contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repo audit (verify_repo.py, with self-test)
        run: python tests/verify_repo.py
      - name: Schema tests (migrations on SQLite)
        run: python tests/verify_schema.py
      - name: Pure-module tests in headless Chrome
        run: python tests/run_js_tests.py all
      - name: Design token contrast
        run: python tools/check_contrast.py

  node-checks:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No lockfile exists until the lockfile workflow has been run once (see IMPLEMENTATION §4).
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
